<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Login | Easymart</title>

<link rel="stylesheet" href="style.css">

</head>


<body class="auth-body">


<div class="auth-wrapper">


    <!-- LEFT -->

    <div class="auth-left">

        <a href="index.html" class="auth-brand">
            🛒 Easymart
        </a>

        <div class="auth-left-content">

            <span class="auth-badge">
                WELCOME BACK
            </span>

            <h1>
                Your shopping
                <span>journey</span>
                continues.
            </h1>

            <p>
                Login to manage your orders,
                discover new products and enjoy
                a better shopping experience.
            </p>

            <div class="auth-big-icon">
                🛍️
            </div>

        </div>

    </div>


    <!-- RIGHT -->

    <div class="auth-right">

        <a
            href="index.html"
            class="mobile-auth-logo"
        >
            🛒 Easymart
        </a>


        <div class="auth-heading">

            <h2>Welcome Back</h2>

            <p>
                Login to your Easymart account
            </p>

        </div>


        <form
            id="loginForm"
            class="auth-form"
        >

            <div class="form-group">

                <label for="loginEmail">
                    Email Address
                </label>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="loginPassword">
                    Password
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter your password"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        onclick="togglePassword('loginPassword', this)"
                    >
                        👁
                    </button>

                </div>

            </div>


            <div class="auth-options">

                <label>

                    <input
                        type="checkbox"
                    >

                    Remember me

                </label>

                <a href="#">
                    Forgot Password?
                </a>

            </div>


            <button
                type="submit"
                class="auth-submit"
            >
                Login
            </button>

        </form>


        <div class="auth-divider">
            <span>OR</span>
        </div>


        <a
            href="index.html"
            class="guest-button"
        >
            Continue as Guest
        </a>


        <p class="auth-footer-text">

            New to Easymart?

            <a href="#">
                Create an account
            </a>

        </p>

    </div>

</div>


<script src="script.js"></script>

</body>
</html>
