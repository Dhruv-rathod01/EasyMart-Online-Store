<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login | MyShop</title>

<style>
*{
  box-sizing:border-box;
  font-family:Arial, sans-serif;
}

body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#f1f3f6;
}

/* MAIN WRAPPER */
.login-wrapper{
  width:760px;
  display:flex;
  background:#fff;
  border-radius:10px;
  overflow:hidden;
  box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

/* LEFT PANEL */
.login-left{
  width:42%;
  background:linear-gradient(135deg,#2874f0,#1f5ed6);
  color:white;
  padding:45px 30px;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.login-left h2{
  font-size:30px;
  margin-bottom:15px;
}

.login-left p{
  font-size:16px;
  line-height:1.6;
}

.login-left img{
  width:100%;
  max-width:230px;
  margin-top:35px;
  align-self:center;
}

/* RIGHT PANEL */
.login-right{
  width:58%;
  padding:45px 35px;
}

/* LOGO */
.logo{
  text-align:center;
  margin-bottom:25px;
}

.logo img{
  width:120px;
}

/* INPUT BOX */
.input-box{
  position:relative;
  margin-bottom:22px;
}

.input-box img{
  position:absolute;
  left:10px;
  top:50%;
  transform:translateY(-50%);
  width:20px;
  opacity:0.6;
}

.login-right input{
  width:100%;
  padding:12px 12px 12px 42px;
  border:none;
  border-bottom:2px solid #ddd;
  font-size:15px;
  outline:none;
}

.login-right input:focus{
  border-bottom-color:#2874f0;
}

/* LOGIN BUTTON */
.login-right button{
  width:100%;
  background:#fb641b;
  color:white;
  border:none;
  padding:13px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  border-radius:6px;
}

/* LINKS */
.extra{
  display:flex;
  justify-content:space-between;
  margin-top:15px;
  font-size:14px;
}

.extra a{
  color:#2874f0;
  text-decoration:none;
}

.extra a:hover{
  text-decoration:underline;
}

.signup{
  text-align:center;
  margin-top:25px;
  font-size:14px;
}

.signup a{
  color:#2874f0;
  font-weight:bold;
  text-decoration:none;
}

/* MOBILE */
@media(max-width:768px){
  .login-wrapper{
    width:90%;
    flex-direction:column;
  }
  .login-left,
  .login-right{
    width:100%;
    text-align:center;
  }
}
</style>
</head>

<body>

<div class="login-wrapper">

  <!-- LEFT -->
  <div class="login-left">
    <h2>Welcome Back</h2>
    <p>
      Login to manage your orders,<br>
      wishlist and recommendations.
    </p>
    <img src="https://cdn-icons-png.flaticon.com/512/5087/5087579.png">
  </div>

  <!-- RIGHT -->
  <div class="login-right">

    <div class="logo">
      <img src="https://cdn-icons-png.flaticon.com/512/263/263142.png">
    </div>

    <!-- NO JS | PURE HTML -->
    <form action="index.html">

      <div class="input-box">
        <img src="https://cdn-icons-png.flaticon.com/512/747/747376.png">
        <input type="text" placeholder="Email or Mobile Number" required>
      </div>

      <div class="input-box">
        <img src="https://cdn-icons-png.flaticon.com/512/3064/3064155.png">
        <input type="password" placeholder="Password" required>
      </div>

      <button type="submit">Login</button>

    </form>

    <div class="extra">
      <a href="#">Forgot Password?</a>
      <a href="index.html">Continue as Guest</a>
    </div>

    <p class="signup">
      New to MyShop? <a href="#">Create an account</a>
    </p>

  </div>

</div>

</body>
</html>
